# Local development stack. `docker compose up -d db` is enough to run `npm run dev`
# against a real Postgres; the `api` service is here so the same compose file can
# stand the whole backend up in one go when you want to check the built image.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pinball
      POSTGRES_PASSWORD: pinball
      POSTGRES_DB: pinball
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pinball -d pinball']
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    profiles: ['full']
    build: .
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://pinball:pinball@db:5432/pinball
      HOST: 0.0.0.0
      PORT: '8787'
    ports:
      - '8787:8787'
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/data/uploads

volumes:
  pgdata:
  uploads:

# learn.pinball.sh — API and database.
#
# Deployment, the whole backend:
#   docker compose --profile full up -d --build
#
# Development, database only, reachable from the host:
#   docker compose -f docker-compose.yml -f compose.dev.yml up -d db
#
# Nothing is published to the host. Both services are reached by name over a
# network your proxy is also on -- `pinball-api:8787` -- so TLS and routing stay
# with the proxy. There is no `expose:` either: it is documentation only, and
# containers sharing a network already reach every port on each other.
#
# Postgres is not reachable from outside `internal` at all; compose.dev.yml is
# what publishes it, and only when you name that file explicitly.

name: pinball

networks:
  # Private: only the API talks to Postgres, and it is never routable from outside.
  internal:
  # Shared with the frontend and your proxy. Create it once if it does not exist:
  #   docker network create reverse-proxy-network
  reverse-proxy-network:
    external: true

volumes:
  pgdata:
  uploads:

services:
  db:
    container_name: pinball-db
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pinball
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-pinball}"
      POSTGRES_DB: pinball
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No published port and no route off `internal`: the API is the only thing
    # that talks to Postgres. For host-based development, where `npm run dev`
    # needs to reach it, add compose.dev.yml (see the header).
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pinball -d pinball"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    container_name: pinball-api
    profiles: ["full"]
    build: .
    image: pinball-api:latest
    restart: unless-stopped
    env_file: [.env]
    environment:
      DATABASE_URL: "postgres://pinball:${POSTGRES_PASSWORD:-pinball}@db:5432/pinball"
      HOST: 0.0.0.0
      PORT: "8787"
      NODE_ENV: production
    volumes:
      # Only used while PINBALL_STORAGE=local; with s3 nothing is written here.
      - uploads:/app/data/uploads
    networks:
      - internal
      - reverse-proxy-network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8787/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
